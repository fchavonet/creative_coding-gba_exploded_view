<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GBA Exploded View</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- DAISYUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- THREE.JS -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
</script>

    <!-- SCRIPT -->
    <script src="./script.js" defer></script>
    <script type="module" src="./gba.js"></script>
</head>

<body>
    <main>
        <!-- TOP CONTAINER -->
        <div class="fixed top-0 left-0 w-full h-auto p-4 flex flex-row justify-between items-center z-2">
            <!-- EXPLODED VIEW CONTROL -->
            <div class="flex flex-row justify-center items-center gap-2">
                <label class="tooltip tooltip-bottom w-72 flex flex-row justify-center items-center" data-tip="Swipe to explode or reassemble the GBA">
                    <input id="spread" class="range range-xs [--range-thumb-size:12px] [--range-p:2px] [--radius-selector:0px]" type="range" min="0" max="100" value="0" aria-label="Exploded view">
                </label>

                <label class="tooltip tooltip-right flex flex-row justify-center items-center gap-2 text-xs whitespace-nowrap" data-tip="Hide shell">
                    <input id="hide-shell" type="checkbox" class="toggle toggle-xs rounded-none [--radius-selector:0px] cursor-pointer" aria-label="Hide shell and screen">
                </label>
            </div>

            <!-- Toggle mode button -->
            <label class="swap swap-rotate">
                <input type="checkbox" class="theme-controller" value="black" />
                <i class="bi bi-sun-fill swap-on"></i>
                <i class="bi bi-moon-stars-fill swap-off"></i>
            </label>
        </div>

        <!-- 3D VIEW -->
        <div id="stage" class="fixed inset-0 z-1"></div>

        <!-- BOTTOM CONTAINER -->
        <div class="fixed left-0 bottom-0 w-full h-auto p-4 flex flex-row justify-between items-center z-2">
            <!-- GITHUB LINK -->
            <a class="tooltip tooltip-right" data-tip="Click to visit the GitHub repository." href="https://github.com/fchavonet/creative_coding-gba_exploded_view" target="_blank">
                <img src="https://img.shields.io/github/stars/fchavonet/creative_coding-gba_exploded_view?style=social&label=GitHub%20Stars" alt="GitHub Stars">
            </a>

            <!-- PORTFOLIO LINK -->
            <a class="link link-hover text-xs" href="https://www.fchavonet.dev" target="_blank">
                www.fchavonet.dev
            </a>
        </div>

        <!-- RESPONSIVE WARNING -->
        <dialog id="responsive-warning" class="modal backdrop-blur-xl">
            <div class="modal-box max-w-xs flex flex-col justify-center items-center gap-4 text-center rounded-xl bg-base-300">
                <i class="bi bi-aspect-ratio text-4xl"></i>

                <p class="text-lg font-semibold -mt-2">
                    This web application is designed for larger screens.
                </p>

                <p class="text-xs">
                    A mobile-friendly version is coming soon...
                </p>
            </div>
        </dialog>
    </main>
</body>

</html>
